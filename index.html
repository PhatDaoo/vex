<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui, shrink-to-fit=no" />
    <title>Vex 3 Modded - No Ads, Gamepad Support</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="apple-touch-icon" type="image/png" href="assets/icon.png" />
    <link rel="stylesheet" href="assets/css/app.css" type="text/css" />
    <style>
        body, html { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        #content { width: 100%; height: 100%; display: block; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="content"></div>
    <div id="loader"></div>
    <div id="orientation"></div>

    <script>
        // Ghi nhận lỗi trên màn hình (để dễ debug trên iPad)
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            alert("Error: " + msg + "\nLine: " + lineNo + "\nCol: " + columnNo);
            return false;
        };

        // --- HỆ THỐNG VƯỢT RÀO QUẢNG CÁO (BYPASS ADS) ---
        var resolvedPromise = Promise.resolve();
        var magicProxy;
        
        try {
            magicProxy = new Proxy(function(){}, {
                get: function(target, prop) {
                    if (prop === 'then') return resolvedPromise.then.bind(resolvedPromise);
                    if (prop === 'catch') return resolvedPromise.catch.bind(resolvedPromise);
                    if (typeof Symbol !== 'undefined' && prop === Symbol.toPrimitive) return function() { return 1; };
                    if (prop === 'toString' || prop === 'valueOf') return function() { return "1"; };
                    
                    return new Proxy(function(){}, {
                        apply: function(t, thisArg, args) {
                            args.forEach(function(arg) {
                                if (typeof arg === 'function') {
                                    var p = String(prop);
                                    if (p !== 'removeListener' && p !== 'removeEventListener' && p !== 'off') {
                                        setTimeout(arg, 100);
                                    }
                                }
                            });
                            return magicProxy;
                        },
                        get: function(t, p) { return magicProxy[p]; }
                    });
                },
                apply: function() { return magicProxy; },
                construct: function() { return {}; }
            });
        } catch (e) {
            // Fallback an toàn nếu trình duyệt không hỗ trợ Proxy (rất cũ)
            magicProxy = {};
        }

        var falseFunctionProxy;
        try {
            falseFunctionProxy = new Proxy(function(){}, {
                get: function(target, prop) { return falseFunctionProxy; },
                apply: function() { return false; },
                construct: function() { return {}; }
            });
        } catch (e) {
            falseFunctionProxy = function() { return false; };
        }

        var stringProxy;
        try {
            stringProxy = new Proxy({}, {
                get: function(target, prop) { return "fake_event"; }
            });
        } catch (e) {
            stringProxy = {};
        }

        // Áp dụng bộ từ điển giả lập
        window.azAdWrapper = magicProxy;
        window._azFeedback = magicProxy;
        window.PokiSDK = magicProxy;
        window.azerionJGSDK = magicProxy;
        window._azerionIntegration = {};
        window.h5branding = { Utils: falseFunctionProxy, Branding: falseFunctionProxy, SplashLoader: { getInstance: function() { return magicProxy; } } };
        window.h5ads = { AdWrapper: function() { return magicProxy; }, AdEvents: stringProxy };
    </script>

    <!-- Hỗ trợ chơi bằng tay cầm (PS/Xbox/MFi) -->
    <script src="gamepad.js"></script>
    
    <!-- Nạp file game gốc -->
    <script>
        var gameName = "vex3.min.js";
        function addScript(src, callback) {
            var s = document.createElement('script');
            s.setAttribute('src', src);
            if (typeof callback === 'function') s.onload = callback;
            document.body.appendChild(s);
        }
        addScript('version.js', function() { addScript(gameName, function() {}); });
    </script>
</body>
</html>
